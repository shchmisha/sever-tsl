server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root /srv/sever/runs;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ =404; }
}
