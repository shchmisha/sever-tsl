limit_req_zone $binary_remote_addr zone=sever_login:10m rate=10r/s;
server {
    listen 80;
    server_name 185.130.214.240;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sever-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://185.130.214.240$request_uri; }
}
server {
    listen 443 ssl;
    server_name 185.130.214.240;
    ssl_certificate /etc/letsencrypt/live/sever-customer-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sever-customer-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    auth_basic "Sever TSL customer trial";
    auth_basic_user_file /etc/sever-tsl/customer.htpasswd;
    client_max_body_size 4g;
    client_body_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cache-Control "private, no-store" always;
    location / {
        limit_req zone=sever_login burst=30 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Sever-User $remote_user;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
